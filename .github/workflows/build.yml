# Builds and self-tests the Mac and Windows apps on real machines.
#   push to main (web/, mac/, windows/)  -> build + self-test, files kept as workflow artifacts
#   tag v*  (for example v1.0.0)         -> the same, then a GitHub Release with the three downloads
name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['web/**', 'mac/**', 'windows/**', '.github/workflows/build.yml', '.github/release-notes.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, single exe + web folder)
        run: dotnet publish windows/PencilSketch/PencilSketch.csproj -c Release -o out/PencilSketch

      - name: Self-test
        shell: pwsh
        run: |
          $env:PENCIL_SELFTEST = "1"
          $p = Start-Process -FilePath "out/PencilSketch/PencilSketch.exe" -RedirectStandardOutput selftest-windows.txt -RedirectStandardError selftest-err.txt -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Error "self-test hung" }
          Get-Content selftest-windows.txt, selftest-err.txt -ErrorAction SilentlyContinue
          if (-not (Select-String -Path selftest-windows.txt -Pattern "^selftest: OK" -Quiet)) { Write-Error "self-test failed"; exit 1 }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path out/PencilSketch -DestinationPath out/PencilSketch-windows-x64.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DSourceDir=$PWD\out\PencilSketch" "/DOutDir=$PWD\out" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: PencilSketch-windows
          path: |
            out/PencilSketch-windows-x64.zip
            out/PencilSketch-Setup.exe
            selftest-windows.txt
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build (universal, ad-hoc signed)
        run: NO_INSTALL=1 ./mac/build.sh

      - name: Self-test
        run: |
          PENCIL_SELFTEST=1 "build/Pencil Sketch.app/Contents/MacOS/PencilSketch" | tee selftest-mac.txt
          grep -q "^selftest: OK" selftest-mac.txt

      - name: Disk image
        run: ./mac/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PencilSketch-mac
          path: |
            build/PencilSketch-mac.dmg
            selftest-mac.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f
          {
            cat .github/release-notes.md
            echo
            echo '### Self-tests of this build'
            echo '```'
            echo "macOS:   $(head -n 1 "$(find dist -name selftest-mac.txt)")"
            echo "Windows: $(head -n 1 "$(find dist -name selftest-windows.txt)" | tr -d '\r')"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            "$(find dist -name PencilSketch-mac.dmg)" \
            "$(find dist -name PencilSketch-Setup.exe)" \
            "$(find dist -name PencilSketch-windows-x64.zip)" \
            --title "Pencil Sketch ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
