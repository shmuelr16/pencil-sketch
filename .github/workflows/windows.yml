# Builds the Windows app, runs its self-test on a real Windows machine, and uploads
# a portable zip and an installer. Runs when the app or its shell changes, or by hand.
name: Windows app

on:
  push:
    branches: [main]
    paths: ['web/**', 'windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, single exe + web folder)
        run: dotnet publish windows/PencilSketch/PencilSketch.csproj -c Release -o out/PencilSketch

      - name: Self-test
        shell: pwsh
        run: |
          $env:PENCIL_SELFTEST = "1"
          $p = Start-Process -FilePath "out/PencilSketch/PencilSketch.exe" -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Error "self-test hung" }
          Get-Content selftest.txt, selftest-err.txt -ErrorAction SilentlyContinue
          if (-not (Select-String -Path selftest.txt -Pattern "^selftest: OK" -Quiet)) { Write-Error "self-test failed"; exit 1 }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path out/PencilSketch -DestinationPath out/PencilSketch-windows-x64.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DSourceDir=$PWD\out\PencilSketch" "/DOutDir=$PWD\out" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: PencilSketch-windows
          path: |
            out/PencilSketch-windows-x64.zip
            out/PencilSketch-Setup.exe
            selftest.txt
          if-no-files-found: error
